# Experiment 3: latency overhead of tokenjuggler vs calling the provider directly.
# One logical model per deployment, so every mode hits exactly the same route.
# Limits are generous - this measures overhead, not throttling.

namespace: exp3
redis: {url_env: REDIS_URL}

defaults:
  limits: {rpm: 1000, input_tpm: 1000000, output_tpm: 1000000}
  max_output_tokens: 64
  max_wait_seconds: 0

accounts:
  databricks: {provider: databricks, host_env: DATABRICKS_HOST, token_env: DATABRICKS_TOKEN}
  openai:     {provider: openai, api_key_env: OPENAI_API_KEY}
  vertex:     {provider: vertex, credentials_json_env: GOOGLE_APPLICATION_CREDENTIALS_JSON, location: global}

models:
  gpt-5.6-terra.databricks:
    family: gpt
    price: {input_per_mtok: 2.0, output_per_mtok: 12.0}
    deployments: [{account: databricks, model_id: system.ai.gpt-5-6-terra}]
  gpt-5.6-terra.openai:
    family: gpt
    price: {input_per_mtok: 2.0, output_per_mtok: 12.0}
    deployments: [{account: openai, model_id: gpt-5.6-terra}]
  gemini-3.8-flash.databricks:
    family: gemini
    price: {input_per_mtok: 0.75, output_per_mtok: 3.75}
    deployments: [{account: databricks, model_id: system.ai.gemini-3-8-flash}]
  gemini-3.8-flash.vertex:
    family: gemini
    price: {input_per_mtok: 0.75, output_per_mtok: 3.75}
    deployments: [{account: vertex, model_id: gemini-3.8-flash}]
