[project]
name = "tokenjuggler"
version = "0.1.0"
description = "One interface to GPT, Gemini and Claude across many providers, with shared Redis quota enforcement, failover and cost tracking"
authors = [
    { name = "ishu0505", email = "iparmar0505@gmail.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "google-auth>=2.58.0",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "openai>=3.19.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "redis[hiredis]>=8.1.0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
tokenjuggler = "tokenjuggler:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.38.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
